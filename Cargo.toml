[workspace]
resolver = "3"
members = [
  "crates/chewing_imk",
  "crates/chewing_imk_core",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[workspace.dependencies]
log = "0.4"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-input-method-kit = "0.3"
oslog = "0.2"
